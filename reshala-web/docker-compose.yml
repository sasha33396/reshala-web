services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    expose:
      - "9090"
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    volumes:
      - ${FLEET_DB_HOST_PATH:-/root/.reshala_fleet}:/app/fleet_db
      - ${SSH_KEYS_HOST_PATH:-/root/.ssh}:/app/ssh_keys
      - ${PLUGINS_HOST_PATH:-./plugins}:/app/plugins:ro
    env_file: .env
    environment:
      - NODE_ENV=production
      - FLEET_DB_PATH=/app/fleet_db
      - SSH_KEYS_DIR=/app/ssh_keys
      - PLUGINS_DIR=/app/plugins
      - BACKEND_PORT=3001
      - PROMETHEUS_URL=http://prometheus:9090
      - SOCKS5_HOST=${SOCKS5_HOST:-}
      - SOCKS5_PORT=${SOCKS5_PORT:-1080}
      - SOCKS5_USER=${SOCKS5_USER:-}
      - SOCKS5_PASS=${SOCKS5_PASS:-}
      - REMNAWAVE_URL=${REMNAWAVE_URL:-}
      - REMNAWAVE_API_KEY=${REMNAWAVE_API_KEY:-}
      - DATA_DIR=/app/data
    expose:
      - "3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/api/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=/api
      - NEXT_PUBLIC_WS_URL=
      - API_PROXY_TARGET=http://backend:3001/api
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
  prometheus_data:
